services:
  favtracks:
    build: .
    container_name: favtracks
    restart: unless-stopped
    ports:
      - "127.0.0.1:5055:5050"
    volumes:
      # Host data directory for favtracks.db
      - ~/data/favtracks:/data
      # garmin_nostra DB and GPX files (symlinks don't work in Docker)
      - ~/data/garminnostra/garmin_nostra.db:/data/garmin_nostra.db:ro
      - ~/data/garminnostra/gpx:/data/gpx:ro
      # Config file (read-only)
      - ./config.toml:/app/config.toml:ro
    environment:
      - CONFIG_FILE=/app/config.toml
      - TZ=Europe/Berlin
