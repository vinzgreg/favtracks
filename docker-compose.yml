services:
  favtracks:
    build: .
    container_name: favtracks
    restart: unless-stopped
    ports:
      - "127.0.0.1:5055:5000"
    volumes:
      # Host data directory — adjust to match your garmin_nostra data location
      - ~/data/favtracks:/data
      # Config file (read-only)
      - ./config.toml:/app/config.toml:ro
    environment:
      - CONFIG_FILE=/app/config.toml
      - TZ=Europe/Berlin
